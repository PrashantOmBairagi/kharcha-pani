# Test-only overrides (never packaged, never touch main config).
# 1. @DataJpaTest swaps in embedded H2, but main properties pin the MySQL
#    dialect (which emits `engine=InnoDB` DDL that H2 rejects).
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# 2. Full @SpringBootTest (contextLoads) boots without IDE env vars:
#    same dev-only fallback secret as main properties, H2 instead of MySQL.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
