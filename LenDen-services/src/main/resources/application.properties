spring.application.name=LenDenMicroservice
spring.datasource.url=${XDB_URL:jdbc:mysql://localhost:3306/lendendb}

spring.datasource.username=${XDB_USERNAME:root}
spring.datasource.password=${XDB_PASSWORD}
server.port = 8092
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
