spring.application.name=LenDenMicroservice
spring.datasource.url=${lendenDB_URL:jdbc:mysql://localhost:3306/lendendb}

spring.datasource.username=${lendenDB_USERNAME:root}
spring.datasource.password=${lendenDB_PASSWORD}
server.port = 8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
