spring.application.name=kharcha-pani-core
server.port= 8080
spring.datasource.url=${coreDB_URL:jdbc:mysql://localhost:3306/xpensetrackerdb}

spring.datasource.username=${coreDB_USERNAME:root}
spring.datasource.password=${coreDB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
jwt.accessSecret=${JWT_ACCESS_SECRET}
jwt.refreshSecret=${JWT_REFRESH_SECRET}

# 5 minute access expiration
jwt.accessExpiration=${JWT_ACCESS_EXPIRATION:300000}

# 10days refresh expiration
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:864000000}
